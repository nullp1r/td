[workspace]
resolver = "3"
members = ["td-*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "*"
pretty_assertions = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
syn = { version = "*", features = ["full"] }
thiserror = "*"
tokio = "*"
tracing = "*"
tracing-subscriber = "*"

td-client = { path = "td-client" }
td-codegen = { path = "td-codegen" }
td-parser = { path = "td-parser" }
td-sys = { path = "td-sys" }
td-types = { path = "td-types" }

[workspace.lints.clippy]
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
wildcard_dependencies = "allow"

absolute_paths = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
elidable_lifetime_names = "deny"
needless_pass_by_value = "deny"
panic = "deny"
string_slice = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_wraps = "deny"

byte_char_slices = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
default_trait_access = "allow"
identity_op = "allow"
large_futures = "allow"
len_without_is_empty = "allow"
manual_div_ceil = "allow"
manual_is_ascii_check = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
redundant_pattern_matching = "allow"
similar_names = "allow"
single_match_else = "allow"

# expect_used = "deny"
# indexing_slicing = "deny"
# todo = "deny"
# unimplemented = "deny"
# unreachable = "deny"
# unwrap_used = "deny"
